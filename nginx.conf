server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Não anunciar a versão do nginx no header Server.
    server_tokens off;

    # O Cloudflare e o Traefik ficam na frente; o IP real vem no header.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff font/woff2;

    # ─────────────────────────────────────────────────────────────────────
    # Cabeçalhos de segurança — equivalem ao bloco "headers" do vercel.json,
    # que deixa de valer fora da Vercel.
    #
    # ATENÇÃO à pegadinha do nginx: `add_header` num `location` DESCARTA todos
    # os `add_header` herdados do `server`. Como /assets/ e = /index.html
    # precisam dos próprios headers de cache, eles teriam ficado sem nenhum
    # header de segurança — justamente o index.html, que é onde
    # X-Frame-Options e frame-ancestors importam. Por isso o include é
    # repetido em cada location. Não "limpe" essa repetição.
    #
    # A Content-Security-Policy que restringe recursos NÃO está aqui: ela é
    # injetada como <meta http-equiv> no index.html em tempo de build
    # (plugin dna-csp em vite.config.ts), pra acompanhar o artefato em
    # qualquer hospedagem. O header abaixo só carrega frame-ancestors, que
    # `meta` não suporta.
    # ─────────────────────────────────────────────────────────────────────
    include /etc/nginx/conf.d/security-headers.inc;

    # Bundles do Vite têm hash no nome: podem ser cacheados pra sempre.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # O index.html nunca pode ficar em cache, senão o deploy novo não aparece
    # pra quem já visitou o site.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # SPA: toda rota desconhecida cai no index.html — equivale ao
    # { "source": "/(.*)", "destination": "/index.html" } do vercel.json.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/conf.d/security-headers.inc;
    }
}
