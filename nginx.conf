server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O Cloudflare e o Traefik ficam na frente; o IP real vem no header.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff font/woff2;

    # Bundles do Vite têm hash no nome: podem ser cacheados pra sempre.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O index.html nunca pode ficar em cache, senão o deploy novo não aparece
    # pra quem já visitou o site.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # SPA: toda rota desconhecida cai no index.html — equivale ao
    # { "source": "/(.*)", "destination": "/index.html" } do vercel.json.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cabeçalhos de segurança básicos (a Vercel não entregava nenhum).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
